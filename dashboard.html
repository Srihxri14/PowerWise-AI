<section class="panel">

<h1>Energy Prediction Dashboard</h1>

<div id="input-container" class="input-grid"></div>

<button id="predict-button" class="btn btn-primary">
Predict Energy
</button>

</section>


<section class="panel">

<h2>Prediction Result</h2>

<div class="prediction-grid">

<div class="prediction-box">
<h3>⚡ Energy Consumption</h3>
<p id="consumption-value">--</p>
</div>

<div class="prediction-box">
<h3>⚠️ Energy Wastage</h3>
<p id="wastage-value">--</p>
</div>

</div>

<div id="prediction-message" class="prediction-message">
Waiting for prediction...
</div>

</section>


<section class="panel">

<h2>Analytics Charts</h2>

<div class="chart-grid">

<canvas id="consumption-chart"></canvas>

<canvas id="pie-chart"></canvas>

</div>

</section>
