<main class="page-container">

<section class="panel">

<h1>Upload Dataset & Train Model</h1>

<p>
Upload CSV dataset and train AI model to predict electricity consumption and wastage.
</p>


<!-- Upload Section -->

<div class="upload-section">

<label>Select CSV File</label>

<input 
type="file" 
id="data-file" 
accept=".csv"
/>

</div>


<!-- Buttons -->

<div class="button-group">

<button 
id="load-sample-button"
class="btn btn-secondary"
>
Load Sample
</button>


<button 
id="train-sample-button"
class="btn btn-primary"
>
Train Sample
</button>


<button 
id="train-button"
class="btn btn-primary"
>
Train Model
</button>


<button 
id="clear-button"
class="btn btn-secondary"
>
Clear
</button>

</div>


<!-- Status -->

<div 
id="status-panel"
class="status-panel"
>
</div>


<!-- Preview -->

<h2>Dataset Preview</h2>

<pre 
id="preview"
class="preview-box"
>
No Data
</pre>



<!-- Loss Chart -->

<h2>Training Loss</h2>

<div class="chart-container">

<canvas 
id="loss-chart"
></canvas>

</div>


</section>
